name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify package.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Verify package metadata
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            if (!pkg.author.includes('Riwut Libinuko')) throw new Error('Missing author');
            if (!pkg.author.includes('cakriwut@gmail.com')) throw new Error('Missing email');
            if (!pkg.omp.repository.includes('can1357/oh-my-pi')) throw new Error('Missing OMP reference');
            console.log('Metadata OK');
          "

      - name: Check no secrets in source
        run: |
          if grep -rE "npm_[A-Za-z0-9]{36}" --include="*.ts" --include="*.js" --include="*.json" --include="*.md" .; then
            echo "ERROR: Potential NPM token found in source!"
            exit 1
          fi
          echo "No secrets detected"

      - name: Verify all source files present
        run: |
          for f in index.ts commands.ts config.ts routing.ts provider.ts types.ts state.ts ui.ts constants.ts; do
            [ -f "src/$f" ] || { echo "Missing: src/$f"; exit 1; }
          done
          echo "All source files present"

      - name: Dry run pack
        run: npm pack --dry-run
