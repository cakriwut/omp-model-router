name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true  # May fail due to OMP dependencies
      
      - name: Check for secrets
        run: |
          # Ensure no hardcoded tokens
          if grep -r "npm_.*[0-9A-Za-z]{40,}" . --include="*.json" --include="*.ts" --include="*.js" --include="*.md"; then
            echo "ERROR: Potential NPM token found in source code!"
            exit 1
          fi
          if grep -r "github_pat_.*" . --include="*.json" --include="*.ts" --include="*.js" --include="*.md"; then
            echo "ERROR: Potential GitHub token found in source code!"
            exit 1
          fi
          echo "No secrets detected"
      
      - name: Verify package metadata
        run: |
          if ! grep -q "Riwut Libinuko" package.json; then
            echo "ERROR: Author metadata missing"
            exit 1
          fi
          if ! grep -q "cakriwut@gmail.com" package.json; then
            echo "ERROR: Author email missing"
            exit 1
          fi
          if ! grep -q "https://github.com/can1357/oh-my-pi" package.json; then
            echo "ERROR: OMP repository reference missing"
            exit 1
          fi