name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"

      - name: Sync package.json version to tag
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Configure NPM auth
        run: |
          echo "@cakriwut:registry=https://registry.npmjs.org/" >> $HOME/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN_CAKRIWUT }}" >> $HOME/.npmrc

      - name: Publish to NPM
        run: |
          npm publish --access public || {
            if npm view "@cakriwut/omp-model-router@${{ steps.version.outputs.version }}" version 2>/dev/null; then
              echo "⚠️ Version ${{ steps.version.outputs.version }} already published — skipping"
            else
              echo "❌ npm publish failed"
              exit 1
            fi
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
